[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Server-side API routes must be declared before the SPA fallback.
[[redirects]]
  from = "/api/deriv/oauth/start"
  to = "/.netlify/functions/deriv-oauth-start"
  status = 200

[[redirects]]
  from = "/api/deriv/oauth/callback"
  to = "/.netlify/functions/deriv-oauth-callback"
  status = 200

[[redirects]]
  from = "/api/deriv/session"
  to = "/.netlify/functions/deriv-session"
  status = 200

# React Router is a client-side SPA. Keep this fallback after real assets/routes.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
